<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tallgjenkjenning</title>
  <style>
    body { font-family: system-ui; text-align: center; }
    canvas { background: #000; touch-action: none; border-radius: 8px; }
    button { font-size: 1.2rem; margin: 8px; }
  </style>
</head>
<body>
  <h1>Skriv et tall</h1>
  <canvas id="c" width="280" height="280"></canvas><br>
  <button id="guess">Gjett</button>
  <button id="clear">Tøm</button>
  <p id="result"></p>

  <script>
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    const result = document.getElementById("result");

    function clearCanvas() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, c.width, c.height);
      result.textContent = "";
    }
    clearCanvas();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 18;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Pointer events fungerer med mus, finger og Apple Pencil
    let drawing = false;
    c.onpointerdown = e => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
    c.onpointermove = e => { if (drawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } };
    c.onpointerup = c.onpointerleave = () => { drawing = false; };

    document.getElementById("clear").onclick = clearCanvas;
    document.getElementById("guess").onclick = async () => {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: c.toDataURL("image/png") }),
      });
      const r = await res.json();
      result.textContent = r.error ?? `Jeg tror det er ${r.digit} (${Math.round(r.confidence * 100)} % sikker)`;
    };
  </script>
</body>
</html>
