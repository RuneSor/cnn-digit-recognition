<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tallgjenkjenning med «ikke tall»</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      margin: 0;
      padding: 16px;
      background: #f4f4f5;
      color: #18181b;
    }
    canvas {
      background: #000;
      border-radius: 12px;
      touch-action: none;       /* hindrer at siden scroller mens du tegner på iPad */
      width: min(280px, 80vw);
      aspect-ratio: 1;
    }
    button {
      font-size: 1.1rem;
      padding: 8px 20px;
      margin: 12px 6px;
      border-radius: 8px;
      border: 1px solid #a1a1aa;
      background: #fff;
      cursor: pointer;
    }
    #result { font-size: 1.4rem; min-height: 1.6em; }
    #bars {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      gap: 4px;
      max-width: 352px;
      margin: 0 auto;
      height: 80px;
      align-items: end;
    }
    .bar { background: #3b82f6; border-radius: 3px 3px 0 0; min-height: 2px; }
    .bar.top { background: #16a34a; }
    #labels {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      max-width: 352px;
      margin: 4px auto 0;
      font-size: 0.85rem;
    }
    .bar.nan { background: #a1a1aa; }
    .bar.nan.top { background: #dc2626; }
    #labels .nan { font-size: 0.7rem; line-height: 1.1; }
    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    nav a {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #a1a1aa;
      background: #fff;
      color: inherit;
      text-decoration: none;
      font-size: 0.95rem;
    }
    nav a[aria-current="page"] {
      background: #18181b;
      border-color: #18181b;
      color: #fff;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Bare sifre</a>
    <a href="nan.html" aria-current="page">Med «ikke tall»</a>
  </nav>
  <h1>Skriv et tall (0–9)</h1>
  <p>Denne modellen har en egen kategori for ting som ikke er tall. Prøv å skrible, skrive en bokstav eller tegne noe annet.</p>
  <canvas id="canvas" width="280" height="280"></canvas><br>
  <button id="guess">Gjett</button>
  <button id="clear">Tøm</button>
  <p id="result">Laster modell …</p>
  <div id="bars"></div>
  <div id="labels"></div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.min.js"></script>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const result = document.getElementById("result");
    const bars = document.getElementById("bars");
    const labels = document.getElementById("labels");

    // Søylediagram med én søyle per siffer, og en ekstra for «ikke tall»
    const IKKE_TALL = 10;
    for (let i = 0; i < 10; i++) {
      bars.insertAdjacentHTML("beforeend", '<div class="bar"></div>');
      labels.insertAdjacentHTML("beforeend", `<span>${i}</span>`);
    }
    bars.insertAdjacentHTML("beforeend", '<div class="bar nan"></div>');
    labels.insertAdjacentHTML("beforeend", '<span class="nan">ikke<br>tall</span>');

    // ---- Tegneflate ----
    // Svart bakgrunn og hvit strek, som MNIST-bildene
    function clearCanvas() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      result.textContent = "";
      for (const bar of bars.children) {
        bar.style.height = "0";
        bar.classList.remove("top");
      }
    }

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 18;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Canvas-et kan være skalert med CSS, så vi regner om til canvas-koordinater
    function point(e) {
      const rect = canvas.getBoundingClientRect();
      return [
        (e.clientX - rect.left) * (canvas.width / rect.width),
        (e.clientY - rect.top) * (canvas.height / rect.height),
      ];
    }

    let drawing = false;
    canvas.addEventListener("pointerdown", (e) => {
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      ctx.beginPath();
      ctx.moveTo(...point(e));
      ctx.lineTo(...point(e));   // gjør at et enkelt trykk også blir en prikk
      ctx.stroke();
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!drawing) return;
      ctx.lineTo(...point(e));
      ctx.stroke();
    });
    canvas.addEventListener("pointerup", () => { drawing = false; });
    canvas.addEventListener("pointercancel", () => { drawing = false; });

    // ---- Forbehandling: gjør tegningen lik et MNIST-bilde ----
    // Klipp ut tegningen, skaler den til ca. 20×20 og sentrer den i en 28×28-ramme.
    function toTensor() {
      const w = canvas.width, h = canvas.height;
      const px = ctx.getImageData(0, 0, w, h).data;

      let minX = w, minY = h, maxX = -1, maxY = -1;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (px[(y * w + x) * 4] > 0) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return null;   // ingenting tegnet

      const bw = maxX - minX + 1, bh = maxY - minY + 1;
      const scale = 20 / Math.max(bw, bh);
      const dw = bw * scale, dh = bh * scale;

      const small = document.createElement("canvas");
      small.width = small.height = 28;
      const sctx = small.getContext("2d");
      sctx.fillStyle = "#000";
      sctx.fillRect(0, 0, 28, 28);
      sctx.imageSmoothingQuality = "high";
      sctx.drawImage(canvas, minX, minY, bw, bh, (28 - dw) / 2, (28 - dh) / 2, dw, dh);

      // Gråtoneverdier 0–1. Normaliseringen skjer inne i modellen.
      const data = sctx.getImageData(0, 0, 28, 28).data;
      const input = new Float32Array(28 * 28);
      for (let i = 0; i < input.length; i++) input[i] = data[i * 4] / 255;
      return new ort.Tensor("float32", input, [1, 1, 28, 28]);
    }

    // ---- Modellen ----
    let session = null;
    ort.InferenceSession.create("mnist_cnn_ikke_tall.onnx")
      .then((s) => {
        session = s;
        clearCanvas();
      })
      .catch((err) => {
        result.textContent = "Klarte ikke å laste modellen.";
        console.error(err);
      });

    async function guess() {
      if (!session) return;
      const tensor = toTensor();
      if (!tensor) {
        result.textContent = "Tegn et tall først";
        return;
      }
      const output = await session.run({ image: tensor });
      const probs = Array.from(output.probs.data);
      const digit = probs.indexOf(Math.max(...probs));
      const sikker = Math.round(probs[digit] * 100);

      result.textContent = digit === IKKE_TALL
        ? `Dette ser ikke ut som et tall (${sikker} % sikker)`
        : `Jeg tror det er ${digit} (${sikker} % sikker)`;
      probs.forEach((p, i) => {
        bars.children[i].style.height = `${Math.max(2, p * 80)}px`;
        bars.children[i].classList.toggle("top", i === digit);
      });
    }

    document.getElementById("guess").addEventListener("click", guess);
    document.getElementById("clear").addEventListener("click", clearCanvas);
  </script>
</body>
</html>
